# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be direct and concise. Focus on security, performance, scalability and parity with the web app. Skip trivial style nitpicks."

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/.expo/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/android/**"          # generated by `expo prebuild`; configure in app.json / config plugins instead
    - "!**/ios/**"
    - "!**/package-lock.json"
    - "!**/expo-env.d.ts"
    - "!**/*.{png,jpg,jpeg,webp,gif,ttf,otf}"

  path_instructions:
    # ---------- Global ----------
    - path: "**/*"
      instructions: |
        Context: two React Native (Expo SDK 58, Expo Router, TypeScript strict) store apps for a
        wedding marketplace in Kerala — apps/customer (role USER) and apps/vendor (role VENDOR) —
        sharing packages/core (logic) and packages/ui (design system). The web app in the separate
        wedwizz-client repo is the source of truth for business logic; this repo ports it.
        Review priorities in order: 1. SECURITY  2. PERFORMANCE  3. SCALABILITY  4. CLEAN CODE.
        For each issue, state the risk briefly and give a concrete fix.
        Flag: `any`, unsafe type assertions, unhandled promise rejections (including floating
        `void` promises that can reject silently), swallowed errors, console.log left in app code,
        and new business logic without tests.

    # ---------- Shared logic ----------
    - path: "packages/core/src/**"
      instructions: |
        This code is copied from the web app's src/lib and must behave identically. Flag changes to
        business rules (validation, limits, timers, error messages, API payloads) that are not
        needed for React Native, and ask whether the web app needs the same change.
        Outside `native/`, code must stay plain TypeScript: no imports from react-native or expo-*
        (so it runs in Vitest and stays portable). Platform differences go behind an interface
        with a native adapter in `native/`.
        Must not import from apps/* or packages/ui (dependencies point app -> ui -> core).

    - path: "packages/core/src/api/**"
      instructions: |
        API client and session handling. Check:
        - Access token kept in memory only; never written to storage or logs.
        - Refresh is single-flight: concurrent 401s share one refresh request. Refresh tokens rotate
          and reusing an old one revokes the whole session, so flag anything that could send the
          same refresh token twice (parallel refreshes, retries after a lost response, app resumes).
        - A request is retried at most once after refresh; auth endpoints never trigger refresh.
        - Timeouts on every request; errors normalised through api-error.
        - No base URL, keys or tokens hard-coded; config comes from EXPO_PUBLIC_* variables, and
          nothing secret may be put in EXPO_PUBLIC_* (it is embedded in the app bundle).

    - path: "packages/core/src/native/**"
      instructions: |
        Native adapters. Check:
        - Refresh token and any credential live only in expo-secure-store, never in SQLite,
          AsyncStorage, the kv-store or plain files.
        - The kv-store (expo-sqlite) holds only non-sensitive data (pending action, location choice,
          visitor id); flag personal data (phone numbers, chat text, addresses) written there.
        - Location: requested only on a user action, coarse accuracy, one reading, no background
          tracking; every failure returns a status instead of throwing.
        - Storage reads tolerate missing or corrupt values.

    - path: "packages/core/src/chat/**"
      instructions: |
        Realtime chat (socket.io). Check that the socket uses the websocket transport, sends the
        token on every reconnect, disconnects on logout and app background where intended, removes
        listeners on cleanup (no duplicate handlers after reconnect), and that slow polling runs
        only while the socket is down. Flag leaks of listeners, timers or intervals.

    # ---------- Design system ----------
    - path: "packages/ui/src/**"
      instructions: |
        Shared components. Check:
        - Colours, spacing, radii, fonts and text styles come from tokens.ts; flag hard-coded values.
        - Components are presentational: props in, callbacks out. No API calls, stores or navigation.
        - Accessibility: pressables have accessibilityRole and accessibilityLabel (icon-only buttons
          especially), touch targets >= 44 pt, text scales with the system font size.
        - Performance: StyleSheet.create or stable style objects (no new style objects per render
          in lists), expo-image for remote images with a fixed size, memo only where measured.

    # ---------- Screens and routes ----------
    - path: "apps/*/src/app/**"
      instructions: |
        Expo Router routes. Each screen is a <Name>Screen (hooks, navigation) rendering a
        <Name>View (props only). Flag business logic or API calls inside View components, and
        screens styled with raw values instead of @wedwizz/ui components and tokens.
        Every screen handles loading, empty, error-with-retry and signed-out states.
        Route params (useLocalSearchParams) are untrusted strings: validate before use.
        Deep links must not perform actions (save, send, call) without the user confirming.
        Protected screens check the session; a signed-out user is sent to login and returned.

    - path: "apps/*/src/features/**"
      instructions: |
        Feature hooks, API functions and stores copied from the web app. Flag behaviour changes
        compared with the web. TanStack Query: stable query keys from the shared key factory,
        sensible staleTime, invalidation after mutations, no fetching in render or useEffect loops.
        Lists use pagination (useInfiniteQuery) rather than loading everything.
        Zustand: select single fields (useStore(s => s.x)) to avoid re-renders; no secrets in stores.

    # ---------- Lists and performance-sensitive code ----------
    - path: "apps/**/*.tsx"
      instructions: |
        Performance on mid-range Android phones:
        - Long or growing lists use FlatList/FlashList with keyExtractor, never .map() inside a
          ScrollView; no nested vertical virtualized lists.
        - No inline anonymous components or heavy computations in renderItem; derive data with
          useMemo when it is expensive.
        - Images: expo-image with explicit width/height and thumbnail URLs for cards
          (full-size only in detail/lightbox).
        - Animations use Reanimated worklets, not JS-driven setState loops.
        - Timers, subscriptions, AppState and socket listeners are cleaned up in effects.
        Security: never log tokens, OTPs, phone numbers or chat content; links opened with
        Linking/WebBrowser must come from the API or a fixed allowlist, not user-typed text.

    # ---------- App config and builds ----------
    - path: "apps/*/app.json"
      instructions: |
        Check permissions are minimal and each has a clear usage description (location, camera,
        photos). No cleartext HTTP allowed in production builds. Bundle identifiers and schemes
        stay distinct per app (com.wedwizz.app vs com.wedwizz.vendor). Flag new config plugins
        that need a development build without a note in the PR.

    - path: "apps/*/eas.json"
      instructions: |
        Build profiles: production must not point at a dev or local API, must not enable dev
        client, and must not contain secrets (use EAS secrets/environment variables).

    - path: "**/package.json"
      instructions: |
        Expo native packages must be added with `npx expo install` (SDK-compatible versions).
        Flag version ranges that drift from the SDK, duplicate copies of react / react-native
        across workspaces, and new dependencies that duplicate an existing one or an Expo module.

    # ---------- Tests ----------
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Tests copied from the web must keep their assertions; flag weakened or deleted checks.
        Native adapters are tested with fakes, not real device APIs. Cover failure paths
        (denied permission, expired session, network error) and avoid real timers.

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
